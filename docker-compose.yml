services:
  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "${REDIS_HOST_IP}:${REDIS_PORT}:${REDIS_CONTAINER_PORT}"
    volumes:
      - ./cash:/data
    networks:
      - app_network

  db:
    image: postgres:18
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_IP}:${POSTGRES_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - ./DB:/var/lib/postgresql/18/docker
    networks:
      - app_network

  email:
    image: mailhog/mailhog
    ports:
      - "${MAIL_SERVER}:${MAIL_PORT_SMTP}:${MAIL_CONTAINER_PORT_SMTP}" # SMTP
      - "${MAIL_SERVER}:${MAIL_PORT_HTTP}:${MAIL_CONTAINER_PORT_HTTP}" # Web UI / API
    networks:
      - app_network

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DB_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_CONTAINER_PORT}/${POSTGRES_DB}
      - REDIS_HOST_IP=redis
      - REDIS_URL=redis://${REDIS_USER}:${REDIS_PASSWORD}@redis:${REDIS_CONTAINER_PORT}/0
      - REDIS_PORT=${REDIS_CONTAINER_PORT}
      - REDIS_USER=${REDIS_USER}
      - MAIL_SERVER=email
      - MAIL_PORT_SMTP=${MAIL_CONTAINER_PORT_SMTP}
    depends_on:
      - db
      - redis
    networks:
      - app_network

networks:
  app_network:
    driver: bridge