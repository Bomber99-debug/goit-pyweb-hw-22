[project]
name = "goit-pyweb-hw-22"
version = "0.1.0"
description = ""
authors = [
    { name = "Bomber99-debug", email = "andreyrybchenko16@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14,<4"

dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.3,<0.53.0)",

    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",

    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",

    "python-jose (>=3.5.0,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "bcrypt (==4.3.0)",
    "setuptools (>=84.0.0,<85.0.0)",

    "libgravatar (>=1.0.4,<2.0.0)",
    "fastapi-mail (>=1.6.5,<2.0.0)",

    "redis (==8.0.1)",
    "fastapi-cache2 (>=0.2.2,<0.3.0)",

    "fastapi-limiter (>=0.2.0,<0.3.0)",
    "pyrate-limiter (>=4.4.0,<5.0.0)",

    "cloudinary (>=1.46.0,<2.0.0)"
]


[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sphinx (>=9.1.0,<10.0.0)"
]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"